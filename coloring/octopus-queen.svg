<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1100" width="850" height="1100">
  <defs>
    <!-- outlined "tube" made from a thick black stroke under a slightly thinner white one -->
    <g id="fish">
      <path d="M-60,0 C-40,-38 30,-42 60,0 C30,42 -40,38 -60,0 Z" />
      <path d="M58,0 L100,-32 L92,0 L100,32 Z" />
      <path d="M-5,-34 C5,-55 30,-50 35,-28" />
      <path d="M10,-30 C10,-10 10,10 10,30" fill="none"/>
      <circle cx="-32" cy="-6" r="9" />
      <circle cx="-32" cy="-6" r="3.5" fill="#000"/>
      <path d="M-55,10 C-50,14 -45,14 -42,12" fill="none"/>
    </g>
    <g id="bubble">
      <circle r="1" />
    </g>
  </defs>

  <rect width="850" height="1100" fill="#fff"/>
  <g fill="#fff" stroke="#000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PetriPals | Colony Stack</title>
    <meta name="description" content="Fit colonies of real bacteria into rings around a round petri dish. Fill a ring all the way around to clear it." />
    <link rel="canonical" href="https://jessicasogge.github.io/petripals/colony-stack.html" />
    <!-- How the link looks when it's shared (iMessage, Slack, Discord, social media) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PetriPals" />
    <meta property="og:title" content="PetriPals | Colony Stack" />
    <meta property="og:description" content="Fit colonies of real bacteria into rings around a round petri dish. Fill a ring all the way around to clear it." />
    <meta property="og:url" content="https://jessicasogge.github.io/petripals/colony-stack.html" />
    <meta property="og:image" content="https://jessicasogge.github.io/petripals/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The eight PetriPals, cartoon bacteria, above the words PetriPals: Grow your colony. Dodge antibiotics." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="stack-page">
    <!-- "Growing the colony…" covers the page until game/stack.js has
         filled it in (see game/loading.js). -->
    <div class="loading-overlay arriving">
      <div class="loading-card" role="status">
        <span class="loading-cells" aria-hidden="true"><span></span><span></span></span>
        <span class="loading-text">Growing the colony…</span>
      </div>
    </div>
    <main class="stack-shell">
      <div class="stack-header">
        <h1>Colony Stack</h1>
        <p class="stack-level">Level 1</p>
      </div>

      <!-- The dish, drawn by game/stack.js. Drag around it to move the
           falling piece; tap it to turn the piece. -->
      <div class="stack-dish">
        <svg viewBox="0 0 362 362" role="img" aria-label="A round petri dish. Colony pieces drift in from the rim toward food in the middle.">
          <circle cx="181" cy="181" r="177" fill="#fffbeb" stroke="#ffffff" stroke-width="7" />
          <g class="stack-guides"></g>
          <g class="stack-cells"></g>
          <!-- The food in the middle. -->
          <circle cx="181" cy="181" r="42" fill="#fef3c7" stroke="#fcd34d" stroke-width="2" stroke-dasharray="5 5" />
          <circle cx="173" cy="174" r="13" fill="#fde68a" stroke="#d97706" stroke-width="2.5" />
          <circle cx="193" cy="188" r="9" fill="#fde68a" stroke="#d97706" stroke-width="2.5" />
          <circle cx="170" cy="195" r="5.5" fill="#fde68a" stroke="#d97706" stroke-width="2.5" />
        </svg>
        <p class="stack-cheer" aria-live="polite" hidden></p>
      </div>

      <div class="stack-stats">
        <div class="stack-stat">
          <span>Next</span>
          <svg class="stack-next" viewBox="0 0 40 40" aria-hidden="true"></svg>
        </div>
        <div class="stack-stat"><span>Score</span><b class="stack-score">0</b></div>
        <div class="stack-stat"><span>Rings</span><b class="stack-rings">0</b></div>
        <div class="stack-stat"><span>Cells</span><b class="stack-cell-count">0</b></div>
      </div>

      <!-- Why the falling piece is the shape she is. -->
      <p class="stack-fact"></p>

      <div class="stack-controls">
        <button class="stack-left" type="button" aria-label="Move counterclockwise">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 15 A8 8 0 0 0 5 12" /><path d="M3 8 L5 12 L9 10.5" /></svg>
          <span>Back</span>
        </button>
        <button class="stack-turn" type="button" aria-label="Turn the piece">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" /><path d="M12 2 A10 10 0 0 1 22 12" /><path d="M22 8 L22 12 L18 12" /></svg>
          <span>Turn</span>
        </button>
        <button class="stack-right" type="button" aria-label="Move clockwise">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15 A8 8 0 0 1 19 12" /><path d="M21 8 L19 12 L15 10.5" /></svg>
          <span>Ahead</span>
        </button>
        <button class="stack-drop" type="button" aria-label="Drop the piece in">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="19" r="2.5" /><path d="M7 4 L12 9 L17 4" /><path d="M7 10 L12 15 L17 10" /></svg>
          <span>Drop</span>
        </button>
      </div>
      <p class="stack-keys">Drag around the dish to move the piece, tap it to turn.<span class="stack-key-list"> Keys: ← → around, ↑ turn, ↓ drift in, space to drop.</span></p>

      <!-- The colony reached the rim. -->
      <div class="stack-over" hidden>
        <div class="stack-over-card" role="dialog" aria-modal="true" aria-labelledby="stack-over-title">
          <h2 id="stack-over-title">The colony reached the rim!</h2>
          <p class="stack-final"></p>
          <button class="pick-btn stack-again" type="button">Play again</button>
          <a class="back-link" href="./index.html">Back to home</a>
        </div>
      </div>

      <a class="back-link" href="./index.html">Back to home</a>
    </main>
    <footer class="signature">jsogge 2026</footer>
    <script type="module" src="./game/stack.js"></script>
    <script data-goatcounter="https://petripals.goatcounter.com/count"
            async src="https://gc.zgo.at/count.js"></script>
  </body>
</html>

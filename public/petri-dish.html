<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PetriPals | Petri Dish</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="picker-page">
    <main class="picker-shell dish-shell">
      <header class="dish-title">
        <h1 class="pal-name"></h1>
        <p class="species"><i class="species-name"></i></p>
      </header>
      <div class="petri-dish">
        <div class="agar">
          <!-- Every pal's drawing goes in here, hidden; main.js shows the one picked -->
          <div class="pal-mover"></div>
        </div>
        <div class="win-banner" role="status" hidden>
          <h2>You won!</h2>
          <p class="win-message"></p>
          <p class="fun-fact" hidden><strong>Did you know?</strong> <span class="fun-fact-text"></span></p>
          <div class="banner-buttons">
            <button class="pick-btn play-again" type="button">Play again</button>
            <button class="pick-btn start-over" type="button" hidden>Start over</button>
          </div>
        </div>
      </div>

      <p class="cell-count" aria-live="polite">Level 1 · 1 / 4 cells</p>

      <p class="how-to-play">
        <span class="for-keys">Use the arrow keys to swim.</span>
        <span class="for-touch">Touch and hold where you want to swim.</span>
        Eat nutrients and grow to <span class="target-cells">4</span> cells.<br />
        Any cell that eats a nutrient divides. Don't touch the antibiotic disks or the clear zones around them!
      </p>

      <a class="back-link" href="./pal-picker.html">Pick a different pal</a>
    </main>
    <footer class="signature">jsogge 2026</footer>
    <script type="module" src="./game/main.js"></script>
    <script data-goatcounter="https://petripals.goatcounter.com/count"
            async src="https://gc.zgo.at/count.js"></script>
  </body>
</html>

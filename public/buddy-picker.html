<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PetriPals | Buddy Picker</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="picker-page">
    <main class="picker-shell">
      <p class="eyebrow">Choose your friend</p>
      <h1>Pick a Buddy</h1>

      <div class="picker-grid">
        <article class="buddy-card">
          <div class="buddy-icon pip" aria-label="Pip microbe illustration">
            <svg viewBox="0 0 120 120" role="img" aria-hidden="true">
              <rect x="18" y="38" width="84" height="42" rx="20" fill="#c4b5fd" stroke="#6d28d9" stroke-width="3" />
              <path d="M18 62 C10 54 12 38 6 56" stroke="#6d28d9" stroke-width="3" fill="none" stroke-linecap="round" />
              <circle cx="79" cy="52" r="3" fill="#ddd6fe" />
              <circle cx="40" cy="70" r="3" fill="#ddd6fe" />
              <path d="M40 60 Q49 52 58 60" stroke="#4c1d95" stroke-width="3" fill="none" stroke-linecap="round" />
              <path d="M62 60 Q71 52 80 60" stroke="#4c1d95" stroke-width="3" fill="none" stroke-linecap="round" />
              <ellipse cx="42" cy="72" rx="5" ry="3" fill="#f9a8d4" opacity="0.8" />
              <ellipse cx="78" cy="72" rx="5" ry="3" fill="#f9a8d4" opacity="0.8" />
            </svg>
          </div>
          <h2>Pip</h2>
          <p>Fast and friendly.</p>
          <button class="pick-btn" type="button">Select Pip</button>
        </article>

        <article class="buddy-card">
          <div class="buddy-icon goldie" aria-label="Goldie microbe illustration">
            <svg viewBox="0 0 120 120" role="img" aria-hidden="true">
              <path d="M26 56 C26 39 40 28 60 28 C80 28 94 39 94 56 L94 74 C94 90 79 100 60 100 C41 100 26 90 26 74 Z" fill="#fef3c7" stroke="#b45309" stroke-width="3" />
              <path d="M17 67 C10 58 12 47 18 40" stroke="#b45309" stroke-width="3" fill="none" stroke-linecap="round" />
              <path d="M103 67 C110 58 108 47 102 40" stroke="#b45309" stroke-width="3" fill="none" stroke-linecap="round" />
              <circle cx="48" cy="60" r="5" fill="#78350f" />
              <circle cx="72" cy="60" r="5" fill="#78350f" />
              <circle cx="48" cy="58" r="2" fill="white" />
              <circle cx="72" cy="58" r="2" fill="white" />
              <path d="M51 74 Q60 82 69 74" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round" />
              <ellipse cx="40" cy="77" rx="6" ry="4" fill="#f9a8d4" opacity="0.8" />
              <ellipse cx="80" cy="77" rx="6" ry="4" fill="#f9a8d4" opacity="0.8" />
            </svg>
          </div>
          <h2>Goldie</h2>
          <p>Sunny and steady.</p>
          <button class="pick-btn" type="button">Select Goldie</button>
        </article>

        <article class="buddy-card">
          <div class="buddy-icon bubbles" aria-label="Bubbles microbe illustration">
            <svg viewBox="0 0 120 120" role="img" aria-hidden="true">
              <circle cx="42" cy="64" r="18" fill="#d1fae5" stroke="#0f766e" stroke-width="3" />
              <circle cx="78" cy="64" r="18" fill="#d1fae5" stroke="#0f766e" stroke-width="3" />
              <ellipse cx="60" cy="52" rx="26" ry="22" fill="#a7f3d0" stroke="#0f766e" stroke-width="3" />
              <circle cx="52" cy="54" r="4" fill="#ecfeff" />
              <circle cx="68" cy="54" r="4" fill="#ecfeff" />
              <circle cx="52" cy="66" r="4" fill="#134e4a" />
              <circle cx="68" cy="66" r="4" fill="#134e4a" />
              <path d="M54 75 Q60 80 66 75" stroke="#134e4a" stroke-width="3" fill="none" stroke-linecap="round" />
              <circle cx="30" cy="46" r="5" fill="#ecfeff" opacity="0.8" />
              <circle cx="90" cy="46" r="5" fill="#ecfeff" opacity="0.8" />
            </svg>
          </div>
          <h2>Bubbles</h2>
          <p>Playful and curious.</p>
          <button class="pick-btn" type="button">Select Bubbles</button>
        </article>
      </div>

      <a class="back-link" href="./index.html">Back to home</a>
    </main>
  </body>
</html>

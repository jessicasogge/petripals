<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PetriPals | Buddy Picker</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="picker-page">
    <main class="picker-shell">
      <p class="eyebrow">Choose your friend</p>
      <h1>Pick a Buddy</h1>

      <div class="picker-grid">
        <article class="buddy-card">
          <div class="buddy-icon pip" aria-label="Pip microbe illustration">
            <svg viewBox="0 17 176 176" role="img" aria-hidden="true">
              <path d="M34 105 C24 88 16 122 6 105" stroke="#6d28d9" stroke-width="4" fill="none" stroke-linecap="round" />
              <rect x="30" y="75" width="140" height="60" rx="30" fill="#c4b5fd" stroke="#6d28d9" stroke-width="4" />
              <circle cx="145" cy="90" r="4" fill="#ddd6fe" />
              <circle cx="55" cy="122" r="3" fill="#ddd6fe" />
              <path d="M78 103 Q86 94 94 103" stroke="#4c1d95" stroke-width="4" fill="none" stroke-linecap="round" />
              <path d="M106 103 Q114 94 122 103" stroke="#4c1d95" stroke-width="4" fill="none" stroke-linecap="round" />
              <ellipse cx="70" cy="113" rx="7" ry="4" fill="#f9a8d4" opacity="0.8" />
              <ellipse cx="130" cy="113" rx="7" ry="4" fill="#f9a8d4" opacity="0.8" />
              <ellipse cx="100" cy="117" rx="5" ry="4" fill="#4c1d95" />
            </svg>
          </div>
          <h2>Pip</h2>
          <p>Fast and friendly.</p>
          <button class="pick-btn" type="button">Select Pip</button>
        </article>

        <article class="buddy-card">
          <div class="buddy-icon goldie" aria-label="Goldie microbe illustration">
            <svg viewBox="20 26 160 160" role="img" aria-hidden="true">
              <!-- left coccus -->
              <circle cx="50" cy="114" r="26" fill="#fde68a" stroke="#b45309" stroke-width="4" />
              <circle cx="42" cy="104" r="5" fill="#fef3c7" />
              <!-- right coccus -->
              <circle cx="150" cy="114" r="26" fill="#fde68a" stroke="#b45309" stroke-width="4" />
              <circle cx="142" cy="104" r="5" fill="#fef3c7" />
              <!-- middle coccus with face -->
              <circle cx="100" cy="102" r="30" fill="#fde68a" stroke="#b45309" stroke-width="4" />
              <circle cx="88" cy="88" r="5" fill="#fef3c7" />
              <circle cx="90" cy="100" r="6" fill="#78350f" />
              <circle cx="110" cy="100" r="6" fill="#78350f" />
              <circle cx="92" cy="98" r="2" fill="white" />
              <circle cx="112" cy="98" r="2" fill="white" />
              <ellipse cx="81" cy="112" rx="5" ry="3" fill="#f9a8d4" opacity="0.8" />
              <ellipse cx="119" cy="112" rx="5" ry="3" fill="#f9a8d4" opacity="0.8" />
              <path d="M95 112 Q100 117 105 112" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round" />
            </svg>
          </div>
          <h2>Goldie</h2>
          <p>Sunny and steady.</p>
          <button class="pick-btn" type="button">Select Goldie</button>
        </article>

        <article class="buddy-card">
          <div class="buddy-icon bubbles" aria-label="Bubbles microbe illustration">
            <svg viewBox="0 0 200 200" role="img" aria-hidden="true">
              <g stroke="#0f766e" stroke-width="4" stroke-linecap="round">
                <line x1="100" y1="55" x2="100" y2="33" transform="rotate(0 100 105)" />
                <line x1="100" y1="55" x2="100" y2="33" transform="rotate(30 100 105)" />
                <line x1="100" y1="55" x2="100" y2="33" transform="rotate(60 100 105)" />
                <line x1="100" y1="55" x2="100" y2="33" transform="rotate(90 100 105)" />
                <line x1="100" y1="55" x2="100" y2="33" transform="rotate(120 100 105)" />
                <line x1="100" y1="55" x2="100" y2="33" transform="rotate(150 100 105)" />
                <line x1="100" y1="55" x2="100" y2="33" transform="rotate(180 100 105)" />
                <line x1="100" y1="55" x2="100" y2="33" transform="rotate(210 100 105)" />
                <line x1="100" y1="55" x2="100" y2="33" transform="rotate(240 100 105)" />
                <line x1="100" y1="55" x2="100" y2="33" transform="rotate(270 100 105)" />
                <line x1="100" y1="55" x2="100" y2="33" transform="rotate(300 100 105)" />
                <line x1="100" y1="55" x2="100" y2="33" transform="rotate(330 100 105)" />
              </g>
              <ellipse cx="100" cy="105" rx="62" ry="55" fill="#5eead4" stroke="#0f766e" stroke-width="4" />
              <circle cx="72" cy="78" r="6" fill="#99f6e4" />
              <circle cx="132" cy="82" r="4" fill="#99f6e4" />
              <circle cx="120" cy="138" r="5" fill="#99f6e4" />
              <circle cx="82" cy="100" r="9" fill="#134e4a" />
              <circle cx="118" cy="100" r="9" fill="#134e4a" />
              <circle cx="85" cy="97" r="3" fill="white" />
              <circle cx="121" cy="97" r="3" fill="white" />
              <ellipse cx="66" cy="117" rx="8" ry="5" fill="#f9a8d4" opacity="0.8" />
              <ellipse cx="134" cy="117" rx="8" ry="5" fill="#f9a8d4" opacity="0.8" />
              <path d="M88 119 Q100 131 112 119" stroke="#134e4a" stroke-width="4" fill="none" stroke-linecap="round" />
            </svg>
          </div>
          <h2>Bubbles</h2>
          <p>Playful and curious.</p>
          <button class="pick-btn" type="button">Select Bubbles</button>
        </article>
      </div>

      <a class="back-link" href="./index.html">Back to home</a>
    </main>
  </body>
</html>

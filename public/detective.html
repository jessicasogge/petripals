<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PetriPals | Detective</title>
    <meta name="description" content="Play detective: run lab tests and follow a dichotomous key to name a mystery bacterium." />
    <link rel="canonical" href="https://jessicasogge.github.io/petripals/detective.html" />
    <!-- How the link looks when it's shared (iMessage, Slack, Discord, social media) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PetriPals" />
    <meta property="og:title" content="PetriPals | Detective" />
    <meta property="og:description" content="Play detective: run lab tests and follow a dichotomous key to name a mystery bacterium." />
    <meta property="og:url" content="https://jessicasogge.github.io/petripals/detective.html" />
    <meta property="og:image" content="https://jessicasogge.github.io/petripals/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The eight PetriPals, cartoon bacteria, above the words PetriPals: Grow your colony. Dodge antibiotics." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="picker-page">
    <main class="picker-shell detective-shell">
      <h1>Who's this pal?</h1>
      <p class="case-line">Run lab tests to find out which pal is the mystery.</p>

      <!-- The case: the suspects, the trail through the key so far, and the
           next test. Filled in by game/detective.js from game/key.js. -->
      <section class="case">
        <h2 class="suspects-title">Suspects</h2>
        <ul class="suspects"></ul>

        <ol class="trail" aria-label="Tests done so far"></ol>

        <section class="lab-step">
          <h2 class="step-name" tabindex="-1"></h2>
          <p class="step-question"></p>
          <div class="lab-bench"></div>
          <div class="answers"></div>
          <p class="step-feedback" role="status"></p>
          <button class="pick-btn next-step" type="button" hidden>Next test</button>
        </section>
      </section>

      <!-- The answer, once the key reaches a single pal, and the whole key
           with the path to her highlighted. -->
      <section class="solved" hidden>
        <div class="solved-pal" aria-hidden="true"></div>
        <h2 class="solved-name" tabindex="-1"></h2>
        <p class="species solved-species"></p>
        <p class="fun-fact"><strong>Did you know?</strong> <span class="fun-fact-text"></span></p>

        <h3 class="key-title">The dichotomous key</h3>
        <p class="key-intro">Start at the top and follow the answers. <span class="key-legend">Your path</span> is highlighted.</p>
        <ul class="key-tree"></ul>

        <div class="banner-buttons">
          <a class="pick-btn next-case" href="./detective.html">Next case</a>
        </div>
      </section>

      <a class="back-link" href="./index.html">Back to home</a>
    </main>
    <footer class="signature">jsogge 2026</footer>
    <script type="module" src="./game/detective.js"></script>
    <script data-goatcounter="https://petripals.goatcounter.com/count"
            async src="https://gc.zgo.at/count.js"></script>
  </body>
</html>

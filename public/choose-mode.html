  <body class="picker-page">
    <main class="picker-shell mode-shell">
      <div class="mode-pal" aria-hidden="true"></div>
      <h1>How should <span class="mode-pal-name">your pal</span> play?</h1>
      <section class="mode-grid">
        <article class="pal-card mode-card">
          <h2>Classic</h2>
          <p>Grow your colony through 7 levels without touching the antibiotic disks.</p>
          <a class="pick-btn mode-classic" href="./petri-dish.html">Play classic</a>
        </article>
        <article class="pal-card mode-card">
          <h2>Mixed culture</h2>
          <p>No antibiotics. Race a rival pal to grow a colony of 64 cells first!</p>
          <a class="pick-btn mode-mixed" href="./petri-dish.html">Play mixed culture</a>
        </article>
      </section>
      <a class="back-link" href="./pal-picker.html">Pick a different pal</a>

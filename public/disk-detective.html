<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PetriPals | Disk Detective</title>
    <meta name="description" content="Read a fact about a real antibiotic and find its disk, then learn how it stops bacteria. No score, just facts and tries." />
    <link rel="canonical" href="https://jessicasogge.github.io/petripals/disk-detective.html" />
    <!-- How the link looks when it's shared (iMessage, Slack, Discord, social media) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PetriPals" />
    <meta property="og:title" content="PetriPals | Disk Detective" />
    <meta property="og:description" content="Read a fact about a real antibiotic and find its disk, then learn how it stops bacteria. No score, just facts and tries." />
    <meta property="og:url" content="https://jessicasogge.github.io/petripals/disk-detective.html" />
    <meta property="og:image" content="https://jessicasogge.github.io/petripals/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The eight PetriPals, cartoon bacteria, above the words PetriPals: Grow your colony. Dodge antibiotics." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="picker-page">
    <!-- "Growing the colony…" covers the page until game/disk-detective.js
         has filled it in (see game/loading.js). -->
    <div class="loading-overlay arriving">
      <div class="loading-card" role="status">
        <span class="loading-cells" aria-hidden="true"><span></span><span></span></span>
        <span class="loading-text">Growing the colony…</span>
      </div>
    </div>
    <main class="picker-shell guess-shell">
      <h1>Disk Detective</h1>
      <!-- How many facts you've seen so far, out of all of them. Not a score. -->
      <p class="guess-counter" aria-label="Fact number"></p>
      <!-- A fact with "this drug" in place of its name, from game/guess.js. -->
      <p class="guess-fact"></p>
      <p class="guess-status" aria-live="polite">Which antibiotic is this fact about? Tap its disk!</p>
      <!-- Four antibiotic disks to choose from, made by game/disk-detective.js. -->
      <div class="rivals-grid drug-grid"></div>
      <!-- Once you find it: how that drug works, and whose dishes it's in. -->
      <section class="drug-card" aria-live="polite" hidden></section>
      <div class="rivals-actions">
        <button class="pick-btn next-fact" type="button" hidden>Next fact</button>
      </div>
      <!-- Every disk in the game, grouped by what it attacks. -->
      <details class="drug-guide">
        <summary>All the antibiotic disks</summary>
        <div class="drug-guide-list"></div>
      </details>
      <a class="back-link" href="./index.html">Back to home</a>
    </main>
    <footer class="signature">jsogge 2026</footer>
    <script type="module" src="./game/disk-detective.js"></script>
    <script data-goatcounter="https://petripals.goatcounter.com/count"
            async src="https://gc.zgo.at/count.js"></script>
  </body>
</html>

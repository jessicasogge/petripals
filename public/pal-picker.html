<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PetriPals | Pal Picker</title>
    <meta name="description" content="Pick your PetriPal: real bacteria, from Streptococcus to Bacillus, drawn as cute cartoons." />
    <link rel="canonical" href="https://jessicasogge.github.io/petripals/pal-picker.html" />
    <!-- How the link looks when it's shared (iMessage, Slack, Discord, social media) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PetriPals" />
    <meta property="og:title" content="PetriPals | Pal Picker" />
    <meta property="og:description" content="Pick your PetriPal: real bacteria, from Streptococcus to Bacillus, drawn as cute cartoons." />
    <meta property="og:url" content="https://jessicasogge.github.io/petripals/pal-picker.html" />
    <meta property="og:image" content="https://jessicasogge.github.io/petripals/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The eight PetriPals, cartoon bacteria, above the words PetriPals: Grow your colony. Dodge antibiotics." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="picker-page">
    <main class="picker-shell picker-wide">
      <h1>Pick a Pal</h1>
      <!-- Microscope mode: shows each pal as she'd look after a Gram stain. -->
      <button class="scope-btn" type="button" aria-pressed="false">
        <span class="scope-icon" aria-hidden="true">🔬</span>
        <span class="scope-label">Gram stain</span>
      </button>
      <p class="scope-caption" hidden>
        Under the microscope after a Gram stain:
        <b class="gram-positive">purple = Gram-positive</b>,
        <b class="gram-negative">pink = Gram-negative</b>
      </p>

      <!-- A page of cards for each page of pals, made by game/pal-picker.js
           from game/pals.js. One page shows at a time. -->
      <div class="picker-pages"></div>

      <!-- Paging between the pages of pals (hidden by game/pal-picker.js when
           there's nowhere to go that way). -->
      <nav class="picker-pager" aria-label="More pals">
        <button class="pager-btn pager-back" type="button">← Back</button>
        <button class="pager-btn pager-more" type="button">More pals →</button>
      </nav>

      <a class="back-link" href="./index.html">Back to home</a>
    </main>
    <footer class="signature">jsogge 2026</footer>
    <script type="module" src="./game/pal-picker.js"></script>
    <script data-goatcounter="https://petripals.goatcounter.com/count"
            async src="https://gc.zgo.at/count.js"></script>
  </body>
</html>

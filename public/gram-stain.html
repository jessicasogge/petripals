<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PetriPals | Gram Stain</title>
    <meta name="description" content="Do a Gram stain yourself, one step at a time, and see why some bacteria end up purple and others pink." />
    <link rel="canonical" href="https://jessicasogge.github.io/petripals/gram-stain.html" />
    <!-- How the link looks when it's shared (iMessage, Slack, Discord, social media) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PetriPals" />
    <meta property="og:title" content="PetriPals | Gram Stain" />
    <meta property="og:description" content="Do a Gram stain yourself, one step at a time, and see why some bacteria end up purple and others pink." />
    <meta property="og:url" content="https://jessicasogge.github.io/petripals/gram-stain.html" />
    <meta property="og:image" content="https://jessicasogge.github.io/petripals/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The eight PetriPals, cartoon bacteria, above the words PetriPals: Grow your colony. Dodge antibiotics." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="PetriPals" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="picker-page">
    <!-- "Growing the colony…" covers the page until game/gram-stain.js has
         filled it in (see game/loading.js). -->
    <div class="loading-overlay arriving">
      <div class="loading-card" role="status">
        <span class="loading-cells" aria-hidden="true"><span></span><span></span></span>
        <span class="loading-text">Growing the colony…</span>
      </div>
    </div>
    <main class="picker-shell stain-shell">
      <h1>Gram Stain</h1>
      <p class="stain-intro">
        Three pals are on one slide. Stain them yourself and watch who keeps the purple.
      </p>
      <!-- A button per dye, in order, made by game/gram-stain.js. -->
      <ol class="stain-steps"></ol>
      <!-- The slide, with her picture painted for the step you're on. -->
      <div class="stain-slide"></div>
      <p class="stain-caption" aria-live="polite"></p>
      <div class="rivals-actions">
        <button class="pick-btn stain-again" type="button" hidden>Start over</button>
      </div>
      <a class="back-link" href="./pal-picker.html">Back to the pals</a>
    </main>
    <footer class="signature">jsogge 2026</footer>
    <script type="module" src="./game/gram-stain.js"></script>
    <script data-goatcounter="https://petripals.goatcounter.com/count"
            async src="https://gc.zgo.at/count.js"></script>
  </body>
</html>

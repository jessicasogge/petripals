<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PetriPals | Who’s That Pal?</title>
    <meta name="description" content="Read a fun fact about a real bacterium and guess which PetriPal it belongs to. No score, just facts and tries." />
    <link rel="canonical" href="https://jessicasogge.github.io/petripals/whos-that-pal.html" />
    <!-- How the link looks when it's shared (iMessage, Slack, Discord, social media) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PetriPals" />
    <meta property="og:title" content="PetriPals | Who’s That Pal?" />
    <meta property="og:description" content="Read a fun fact about a real bacterium and guess which PetriPal it belongs to. No score, just facts and tries." />
    <meta property="og:url" content="https://jessicasogge.github.io/petripals/whos-that-pal.html" />
    <meta property="og:image" content="https://jessicasogge.github.io/petripals/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The eight PetriPals, cartoon bacteria, above the words PetriPals: Grow your colony. Dodge antibiotics." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="picker-page">
    <!-- "Growing the colony…" covers the page until game/whos-that-pal.js has
         filled it in (see game/loading.js). -->
    <div class="loading-overlay arriving">
      <div class="loading-card" role="status">
        <span class="loading-cells" aria-hidden="true"><span></span><span></span></span>
        <span class="loading-text">Growing the colony…</span>
      </div>
    </div>
    <main class="picker-shell guess-shell">
      <h1>Who’s That Pal?</h1>
      <!-- How many facts you've seen so far, out of all of them. Not a score. -->
      <p class="guess-counter" aria-label="Fact number"></p>
      <!-- A fact with "this pal" in place of her name, from game/guess.js. -->
      <p class="guess-fact"></p>
      <p class="guess-status" aria-live="polite">Who is this fact about? Tap her!</p>
      <!-- A button for every pal, made by game/whos-that-pal.js. They look
           like the tiles on the rival screen. On a phone, Next fact moves
           above them (styles.css), so you don't scroll down for it. -->
      <div class="guess-board">
        <div class="rivals-grid guess-grid"></div>
        <div class="rivals-actions guess-actions">
          <button class="pick-btn next-fact" type="button" hidden>Next fact</button>
        </div>
      </div>
      <a class="back-link" href="./index.html">Back to home</a>
    </main>
    <footer class="signature">jsogge 2026</footer>
    <script type="module" src="./game/whos-that-pal.js"></script>
    <script data-goatcounter="https://petripals.goatcounter.com/count"
            async src="https://gc.zgo.at/count.js"></script>
  </body>
</html>

# Publish the game to GitHub Pages whenever something lands on main.
# The game is just the files in public/ (HTML, CSS and JavaScript), so Pages
# can serve it with no server. The tests run first; if they fail, or leave
# too much of the game untested (see vitest.config.js), nothing is published.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you rerun it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel one that's already going.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage # the tests, plus a check that they cover the game
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
